<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Chat</title>
</head>
<body>
    <h1>the finance chat</h1>

    <form id="chatForm">
        <label for="prompt"></label>
        <input id="prompt" placeholder="enter the prompt">
        <br><br>
        <center>
            <button type="submit">submit</button>
        </center>
    </form>

    <div id="output"></div>

    <script>
        const input = document.getElementById("prompt");
        const form = document.getElementById("chatForm");
        const output = document.getElementById("output");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            try {
                const response = await fetch(`http://127.0.0.1:8000/ask?query=${encodeURIComponent(input.value)}`);
                const data = await response.json();

                output.innerText = data.answer || JSON.stringify(data);
            } catch (error) {
                output.innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
